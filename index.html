<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스마트 가계부 - Smart Household Budget</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js for analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css?v=6.7">
</head>
<body class="theme-light">
  <!-- LEFT SLIDEBAR DRAWER OVERLAY & SIDEBAR -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="sidebar-drawer" id="sidebar-drawer">
    <div class="drawer-header">
      <div class="drawer-brand">
        <span class="logo-text" style="font-size:1.15rem; font-weight:800; color:var(--text-main);">설정</span>
      </div>
      <button class="icon-btn-ghost" id="close-drawer-btn">
        <i data-lucide="x"></i>
      </button>
    </div>

    <!-- Top Menu Section: 전체 자산, 수입, 현금지출, 카드지출, 전체 지출 with amounts -->
    <div class="drawer-section drawer-views-menu">
      <button class="drawer-menu-item active" data-filter="all">
        <i data-lucide="layout-grid"></i>
        <span class="drawer-menu-label">전체 자산</span>
        <span class="drawer-menu-amount" id="drawer-amt-all"></span>
      </button>
      <button class="drawer-menu-item" data-filter="income">
        <i data-lucide="trending-up"></i>
        <span class="drawer-menu-label">수입</span>
        <span class="drawer-menu-amount" id="drawer-amt-income"></span>
      </button>
      <button class="drawer-menu-item" data-filter="cash">
        <i data-lucide="wallet"></i>
        <div class="drawer-menu-label">
          <span>현금지출</span>
          <span class="drawer-menu-sublabel">(현금/체크)</span>
        </div>
        <span class="drawer-menu-amount" id="drawer-amt-cash"></span>
      </button>
      <button class="drawer-menu-item" data-filter="card">
        <i data-lucide="credit-card"></i>
        <div class="drawer-menu-label">
          <span>카드지출</span>
          <span class="drawer-menu-sublabel">(다음달 예정)</span>
        </div>
        <span class="drawer-menu-amount" id="drawer-amt-card"></span>
      </button>
      <button class="drawer-menu-item" data-filter="total_expense">
        <i data-lucide="pie-chart"></i>
        <span class="drawer-menu-label">전체 지출</span>
        <span class="drawer-menu-amount" id="drawer-amt-total"></span>
      </button>
    </div>

    <div class="drawer-divider"></div>

    <!-- Accounts & Cards Checklist Section (no + button) -->
    <div class="drawer-section">
      <div class="drawer-section-header">
        <span class="section-title-text"><i data-lucide="credit-card"></i> 내 계좌 및 카드 목록</span>
      </div>
      <div class="drawer-checklist" id="drawer-account-checklist">
        <!-- Dynamically populated by JS -->
      </div>
    </div>

    <!-- Footer: Account type selection menu -->
    <div class="drawer-footer-actions">
      <div class="drawer-add-type-menu" id="drawer-add-type-menu" style="display:none;">
        <button class="drawer-type-btn" id="drawer-add-bank-btn">
          <i data-lucide="building-2"></i>
          <div>
            <div class="dtype-title">계좌 (통장)</div>
            <div class="dtype-desc">은행 · 초기잔액 설정</div>
          </div>
        </button>
        <button class="drawer-type-btn" id="drawer-add-credit-btn">
          <i data-lucide="credit-card"></i>
          <div>
            <div class="dtype-title">신용카드</div>
            <div class="dtype-desc">결제일 설정 가능</div>
          </div>
        </button>
        <button class="drawer-type-btn" id="drawer-add-debit-btn">
          <i data-lucide="badge-check"></i>
          <div>
            <div class="dtype-title">체크카드</div>
            <div class="dtype-desc">연결 계좌 설정</div>
          </div>
        </button>
      </div>
      <button class="drawer-add-acc-full-btn" id="drawer-add-account-btn">
        <i data-lucide="plus" id="drawer-add-icon"></i>
        <span id="drawer-add-label">계좌/카드 추가</span>
      </button>
    </div>
  </aside>

  <!-- App Main Content Container -->
  <div class="app-container">
        
        <!-- HEADER SECTION (Matching Screenshot 1 & 2) -->
        <header class="app-header">
          <div class="header-main-bar">
            <div class="header-left">
              <button class="icon-btn-ghost" id="open-drawer-btn" title="메뉴">
                <i data-lucide="menu"></i>
              </button>
              <div class="month-title-selector" id="month-picker-btn">
                <h2 id="month-year-text">9월</h2>
                <i data-lucide="chevron-down" class="month-arrow"></i>
              </div>
            </div>

            <div class="header-right">
              <button class="icon-btn-ghost date-badge-btn" id="today-btn" title="오늘 날짜로 이동">
                <span class="today-date-box" id="today-date-num">16</span>
              </button>
            </div>
          </div>

          <!-- Month Pill Carousel (Horizontal Slide Tab Bar) -->
          <div class="month-carousel-bar">
            <div class="month-carousel" id="month-carousel">
              <!-- Dynamically populated by JS: 9월, 10월, 11월, 12월, 2027, 1월... -->
            </div>
          </div>

          <!-- Hidden legacy container for compatibility -->
          <div style="display: none;" id="account-tabs"></div>
        </header>

        <!-- MAIN VIEW SLIDER -->
        <main class="main-content">

          <!-- VIEW 1: CALENDAR VIEW -->
          <section id="view-calendar" class="app-view active">
            <!-- Calendar Header (Days of week) -->
            <div class="calendar-days-header">
              <div class="day-label sun">일</div>
              <div class="day-label">월</div>
              <div class="day-label">화</div>
              <div class="day-label">수</div>
              <div class="day-label">목</div>
              <div class="day-label">금</div>
              <div class="day-label sat">토</div>
            </div>

            <!-- Calendar Grid -->
            <div class="calendar-grid" id="calendar-grid">
              <!-- JS generates day cells dynamically -->
            </div>
          </section>

          <!-- VIEW 2: ANALYTICS / STATS VIEW -->
          <section id="view-stats" class="app-view">
            <div class="stats-container">
              <div class="stats-header">
                <h3>월간 지출 분석</h3>
                <span class="stats-period" id="stats-period-text">2026년 9월</span>
              </div>

              <div class="chart-box card-glass">
                <canvas id="categoryChart"></canvas>
              </div>

              <div class="category-breakdown-list" id="category-breakdown-list">
                <!-- Category statistics list rendered via JS -->
              </div>
            </div>
          </section>

          <!-- VIEW 3: SETTINGS VIEW -->
          <section id="view-settings" class="app-view">
            <div class="settings-container">
              <h3>설정</h3>
              
              <div class="settings-section-title">
                <i data-lucide="building-2"></i> 등록된 계좌 목록
              </div>
              <div class="settings-card card-glass">
                <div class="account-manage-list" id="bank-account-manage-list">
                  <!-- Populated by JS -->
                </div>
                <button class="action-btn-outlined" id="settings-add-bank-btn">
                  <i data-lucide="plus"></i> 새 통장 추가하기
                </button>
              </div>

              <div class="settings-section-title">
                <i data-lucide="credit-card"></i> 등록된 카드 목록 (신용/체크)
              </div>
              <div class="settings-card card-glass">
                <div class="account-manage-list" id="card-account-manage-list">
                  <!-- Populated by JS -->
                </div>
                <button class="action-btn-outlined" id="settings-add-card-btn">
                  <i data-lucide="plus"></i> 새 카드 추가하기
                </button>
              </div>

              <div class="settings-section-title">
                <i data-lucide="repeat"></i> 고정 지출 · 수입 자동 등록 관리
              </div>
              <div class="settings-card card-glass">
                <div class="recurring-manage-list" id="recurring-manage-list">
                  <!-- Populated by JS -->
                </div>
              </div>
            </div>
          </section>

        </main>

        <!-- Floating Quick Add Plus Button (Image 1 Style FAB) -->
        <div class="fab-group" id="fab-group">
          <button class="main-fab-plus-btn" id="fab-main-plus-btn" title="새 내역 추가">
            <i data-lucide="plus"></i>
          </button>
          <div class="fab-sub-buttons" id="fab-sub-buttons" style="display: none;">
            <button class="fab-btn fab-income" id="fab-income-btn" title="수입 항목 추가">
              <i data-lucide="plus"></i> 수입
            </button>
            <button class="fab-btn fab-expense" id="fab-expense-btn" title="지출 항목 추가">
              <i data-lucide="minus"></i> 지출
            </button>
          </div>
        </div>

      </div>

  <!-- ADD / EDIT TRANSACTION MODAL (Bottom Sheet) -->
  <div class="modal-overlay" id="tx-modal-overlay">
    <div class="modal-bottom-sheet" id="tx-modal">
      <div class="modal-drag-handle"></div>
      
      <div class="modal-header">
        <h3 id="modal-title">새 항목 추가</h3>
        <button class="modal-close-btn" id="close-modal-btn">
          <i data-lucide="x"></i>
        </button>
      </div>

      <form id="tx-form">
        <!-- Type Segment Selector (Expense vs Income) -->
        <div class="type-segment">
          <input type="radio" name="tx-type" id="type-expense" value="expense" checked>
          <label for="type-expense" class="segment-label expense">
            <i data-lucide="minus-circle"></i> 지출
          </label>

          <input type="radio" name="tx-type" id="type-income" value="income">
          <label for="type-income" class="segment-label income">
            <i data-lucide="plus-circle"></i> 수입
          </label>
        </div>

        <!-- Account Target Field -->
        <div class="form-group">
          <label for="tx-account-select">등록된 계좌/카드</label>
          <select id="tx-account-select" class="form-select" required>
            <!-- Injected by JS -->
          </select>
        </div>

        <!-- Amount Input Field -->
        <div class="form-group amount-group">
          <label for="tx-amount">금액 (원)</label>
          <div class="amount-input-wrapper">
            <span class="currency-symbol">₩</span>
            <input type="number" id="tx-amount" placeholder="0" required pattern="[0-9]*" inputmode="numeric">
          </div>
          <!-- Quick Amount Addition Chips -->
          <div class="amount-chips">
            <button type="button" class="chip-btn" data-add="1000">+1천</button>
            <button type="button" class="chip-btn" data-add="10000">+1만</button>
            <button type="button" class="chip-btn" data-add="50000">+5만</button>
            <button type="button" class="chip-btn" data-add="100000">+10만</button>
            <button type="button" class="chip-btn reset" id="amount-clear-btn">C</button>
          </div>
        </div>

        <!-- Date Picker Field -->
        <div class="form-group">
          <label for="tx-date">날짜</label>
          <input type="date" id="tx-date" class="form-input" required>
        </div>

        <!-- Recurring Auto-Entry Checkbox -->
        <div class="form-group">
          <label class="custom-checkbox-wrapper" style="display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; width: 100%;">
            <input type="checkbox" id="tx-is-recurring">
            <span class="checkbox-box"><i data-lucide="check"></i></span>
            <span class="checkbox-text" style="white-space: nowrap; font-size: 0.83rem;">
              <strong>매월 이 날짜에 자동 등록</strong> (고정 수입/지출)
            </span>
          </label>
        </div>

        <!-- Category Grid Selector -->
        <div class="form-group">
          <label>카테고리 선택</label>
          <div class="category-grid" id="category-grid">
            <!-- Categories injected by JS -->
          </div>
          <input type="hidden" id="tx-category" required value="식당">
        </div>

        <!-- Memo / Note -->
        <div class="form-group">
          <label for="tx-memo">내역 메모</label>
          <input type="text" id="tx-memo" class="form-input" placeholder="예: 점심 김치찌개, 이마트 장보기..." autocomplete="off">
        </div>

        <!-- Form Submit Button -->
        <button type="submit" class="submit-btn" id="save-tx-btn">
          <i data-lucide="check"></i> 저장하기
        </button>
      </form>
    </div>
  </div>

  <!-- ADD / EDIT ACCOUNT MODAL (Bottom Sheet) -->
  <div class="modal-overlay" id="acc-modal-overlay">
    <div class="modal-bottom-sheet" id="acc-modal">
      <div class="modal-drag-handle"></div>
      
      <div class="modal-header">
        <h3 id="acc-modal-title">새 계좌 / 통장 등록</h3>
        <button class="modal-close-btn" id="close-acc-modal-btn">
          <i data-lucide="x"></i>
        </button>
      </div>

      <form id="acc-form">
        <!-- Account Type Segment (Bank vs Credit Card vs Debit Card) -->
        <div class="form-group" id="acc-type-group">
          <label id="acc-type-label">자금/계좌 유형</label>
          <div class="type-segment">
            <input type="radio" name="acc-type" id="acc-type-bank" value="bank">
            <label for="acc-type-bank" class="segment-label income" id="acc-type-bank-label">
              <i data-lucide="building-2"></i> 통장
            </label>

            <input type="radio" name="acc-type" id="acc-type-card" value="card" checked>
            <label for="acc-type-card" class="segment-label expense" id="acc-type-card-label">
              <i data-lucide="credit-card"></i> 신용카드
            </label>

            <input type="radio" name="acc-type" id="acc-type-debit" value="debit">
            <label for="acc-type-debit" class="segment-label savings" id="acc-type-debit-label">
              <i data-lucide="check-square"></i> 체크카드
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="acc-name">계좌/카드 별칭</label>
          <input type="text" id="acc-name" class="form-input" placeholder="예: 신한 주거래 통장, 쏠 신용카드" required>
        </div>

        <div class="form-group">
          <label for="acc-bank">은행 / 카드사 선택</label>
          <select id="acc-bank" class="form-select" required>
            <option value="신한은행">🏦 신한은행 / 신한카드</option>
            <option value="카카오뱅크">💛 카카오뱅크</option>
            <option value="KB국민은행">💛 KB국민은행 / 국민카드</option>
            <option value="현대카드">💳 현대카드</option>
            <option value="삼성카드">💳 삼성카드</option>
            <option value="토스뱅크">💙 토스뱅크</option>
            <option value="우리은행">💙 우리은행 / 우리카드</option>
            <option value="하나은행">💚 하나은행 / 하나카드</option>
            <option value="NH농협">💚 NH농협 / 농협카드</option>
            <option value="현금/기타">💵 현금 / 기타</option>
          </select>
        </div>

        <!-- Linked Bank Account for Credit Cards -->
        <div class="form-group" id="card-linked-bank-group" style="display: none;">
          <label for="acc-linked-bank">연결 결제 통장 (대금 출금 계좌)</label>
          <select id="acc-linked-bank" class="form-select">
            <!-- JS populates bank accounts -->
          </select>
        </div>

        <!-- Monthly Payment Day for Credit Cards -->
        <div class="form-group" id="card-payment-day-group" style="display: none;">
          <label for="acc-payment-day">월 결제일 (1일~31일)</label>
          <input type="number" id="acc-payment-day" class="form-input" min="1" max="31" value="25" placeholder="예: 25">
        </div>

        <div class="form-group" id="acc-number-group">
          <label for="acc-number">계좌/카드 번호 (선택)</label>
          <input type="text" id="acc-number" class="form-input" placeholder="예: 110-123-456789" autocomplete="off">
        </div>

        <div class="form-group" id="acc-balance-group">
          <label for="acc-balance">초기 금액 (단위: 원)</label>
          <input type="text" id="acc-balance" class="form-input" placeholder="0" value="0" inputmode="text" autocomplete="off">
        </div>

        <div class="form-group">
          <label>테마 색상</label>
          <div class="color-picker-grid" id="acc-color-grid">
            <button type="button" class="color-chip active" data-color="#6366f1" style="background: #6366f1;" title="인디고"></button>
            <button type="button" class="color-chip" data-color="#3b82f6" style="background: #3b82f6;" title="블루"></button>
            <button type="button" class="color-chip" data-color="#10b981" style="background: #10b981;" title="에메랄드"></button>
            <button type="button" class="color-chip" data-color="#f59e0b" style="background: #f59e0b;" title="앰버"></button>
            <button type="button" class="color-chip" data-color="#ec4899" style="background: #ec4899;" title="핑크"></button>
            <button type="button" class="color-chip" data-color="#8b5cf6" style="background: #8b5cf6;" title="퍼플"></button>
            <button type="button" class="color-chip" data-color="#ef4444" style="background: #ef4444;" title="레드"></button>
            <button type="button" class="color-chip" data-color="#06b6d4" style="background: #06b6d4;" title="시안"></button>
            <label class="color-chip custom-color-chip" id="acc-custom-color-btn" title="사용자 정의 색상 선택">
              <span id="acc-custom-color-icon" class="palette-icon-wrapper" style="display: flex; align-items: center; justify-content: center; pointer-events: none;">🎨</span>
              <input type="color" id="acc-custom-color-input" value="#6366f1">
            </label>
          </div>
          <input type="hidden" id="acc-color" value="#6366f1">
        </div>

        <button type="submit" class="submit-btn" id="save-acc-btn">
          <i data-lucide="check"></i> 등록하기
        </button>
      </form>
    </div>
  </div>

  <!-- SUMMARY CARD DETAIL MODAL -->
  <div class="modal-overlay" id="summary-detail-modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title-group" style="display: flex; align-items: center; gap: 8px;">
          <span id="summary-detail-emoji" style="font-size: 1.3rem;">📑</span>
          <h3 id="summary-detail-title" style="font-size: 1.1rem; font-weight: 700;">상세 내역</h3>
        </div>
        <button class="icon-btn-ghost" id="close-summary-detail-modal-btn">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="summary-detail-total-box" id="summary-detail-total-box">
        <span class="detail-total-label" id="summary-detail-total-label">총 합계</span>
        <span class="detail-total-amount" id="summary-detail-total-amount">₩0</span>
      </div>

      <div class="summary-detail-list" id="summary-detail-list">
        <!-- JS populates items -->
      </div>

      <div class="modal-actions" style="margin-top: 14px;">
        <button type="button" class="btn-secondary" id="close-summary-detail-modal-bottom-btn" style="width: 100%;">닫기</button>
      </div>
    </div>
  </div>

  <!-- CATEGORY MANAGEMENT ACTION MODAL -->
  <div class="modal-overlay" id="cat-action-modal-overlay">
    <div class="modal-card" style="max-width: 400px; padding: 20px;">
      <div class="modal-header">
        <h3 id="cat-action-modal-title" style="font-size: 1.1rem; font-weight: 700;">카테고리 관리</h3>
        <button class="icon-btn-ghost" id="close-cat-action-modal-btn">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div id="cat-action-modal-body" style="margin-top: 14px;">
        <!-- JS injects dynamic view buttons -->
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <i data-lucide="check-circle" id="toast-icon"></i>
    <span id="toast-message">성공적으로 저장되었습니다.</span>
  </div>

  <script type="module" src="app.js?v=6.7"></script>
</body>
</html>
